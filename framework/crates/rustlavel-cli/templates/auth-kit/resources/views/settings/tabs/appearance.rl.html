     through `element.style.setProperty(...)`, which is CSSOM called from a

          </div>
        </div>
      </div>

      <div>

  {{-- ---- Logos ------------------------------------------------------- --}}
  <div class="card">
    <div class="card-header">
      <h3 class="font-semibold">Logo Settings</h3>
      <p class="mt-0.5 text-sm text-ink-500 dark:text-ink-400">
        Upload custom logos for light and dark mode. These will be displayed on the login page and sidebar.
      </p>
    </div>

    <form method="post" action="/admin/settings/appearance/logos" class="card-body space-y-6">
      {!! csrf_field !!}

      <div class="grid gap-6 sm:grid-cols-2">
        {{-- Light --}}
        <div data-logo-box data-upload-url="/admin/settings/appearance/logo">
          <p class="field-label">Light Mode Logo</p>
          <div class="rounded-lg border border-dashed border-ink-300 bg-ink-50 p-4 text-center dark:border-ink-700 dark:bg-ink-900">
            <div data-logo-current @if(!s.theme_logo_light.value) hidden @endif>
              <img data-logo-image @if(s.theme_logo_light.value) src="{{ s.theme_logo_light.value }}" @endif alt="The current light-mode logo"
                   class="mx-auto max-h-16 w-auto">
              <button type="button" data-logo-remove class="mt-2 text-sm text-red-600 hover:underline dark:text-red-400">Remove</button>
            </div>
            <div class="mt-3">
              {{-- The real control is the file input; the button is what people
                   click, because a bare file input cannot be styled and reads
                   differently in every browser. --}}
              <input type="file" data-logo-input hidden accept="image/png,image/jpeg,image/svg+xml">
              <button type="button" class="btn-secondary btn-sm" data-logo-choose>Choose File</button>
              <p class="field-hint mt-2">PNG, JPG, or SVG (max 2MB)</p>
              <p data-logo-status class="field-hint mt-1" hidden></p>
              <p data-logo-error class="field-error mt-1" hidden></p>
            </div>
          </div>
          {{-- The path is what actually gets saved, and it is a plain field on
               purpose: `rustlavel-http` has no multipart parser, so the upload
               above happens over a separate request and writes its result here.
               With JavaScript off the box does nothing and this field is still
               the way to point at a logo. --}}
          <label for="logo_light_path" class="field-hint mt-2 block">Path on this site</label>
          <input id="logo_light_path" name="theme.logo.light" type="text" value="{{ s.theme_logo_light.value }}"
                 data-logo-path spellcheck="false" autocomplete="off" placeholder="/storage/logos/…"
                 class="field-input mt-1 font-mono text-xs">
        </div>

        {{-- Dark. The box itself is dark so a white logo is not an invisible
             logo. --}}
        <div data-logo-box data-upload-url="/admin/settings/appearance/logo">
          <p class="field-label">Dark Mode Logo</p>
          <div class="rounded-lg border border-dashed border-ink-600 bg-ink-900 p-4 text-center">
            <div data-logo-current @if(!s.theme_logo_dark.value) hidden @endif>
              <img data-logo-image @if(s.theme_logo_dark.value) src="{{ s.theme_logo_dark.value }}" @endif alt="The current dark-mode logo"
                   class="mx-auto max-h-16 w-auto">
              <button type="button" data-logo-remove class="mt-2 text-sm text-red-400 hover:underline">Remove</button>
            </div>
            <div class="mt-3">
              <input type="file" data-logo-input hidden accept="image/png,image/jpeg,image/svg+xml">
              <button type="button" class="btn-secondary btn-sm" data-logo-choose>Choose File</button>
              <p class="mt-2 text-xs text-ink-400">PNG, JPG, or SVG (max 2MB)</p>
              <p data-logo-status class="mt-1 text-xs text-ink-400" hidden></p>
              <p data-logo-error class="field-error mt-1" hidden></p>
            </div>
          </div>
          <label for="logo_dark_path" class="field-hint mt-2 block">Path on this site</label>
          <input id="logo_dark_path" name="theme.logo.dark" type="text" value="{{ s.theme_logo_dark.value }}"
                 data-logo-path spellcheck="false" autocomplete="off" placeholder="/storage/logos/…"
                 class="field-input mt-1 font-mono text-xs">
        </div>
      </div>

      <div>
        <button type="submit" class="btn-primary">Save Logos</button>
      </div>
    </form>
  </div>
</div>

{{-- Loaded here rather than from the layout, so it is fetched on this page and
     nowhere else. `defer` because the elements it binds to are above it. --}}
<script src="/js/appearance.js" defer></script>
@endsection
