[package]
name = "rustlavel-storage"
description = "Rustlavel file storage: local disk and S3-compatible object stores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-client.workspace = true
rustlavel-http.workspace = true
tokio.workspace = true
# Signing only: AWS SigV4 is HMAC-SHA256 over a canonical request. The
# signing scheme is written here; the hash primitives are not.
sha2 = "0.10"
hmac = "0.12"
# For the `Content-MD5` header S3 requires on a lifecycle configuration and on
# nothing else this crate sends. Not a security use — the checksum the API
# demands — and one of the primitives the project does not write for itself.
md-5 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
