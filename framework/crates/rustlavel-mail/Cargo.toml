[package]
name = "rustlavel-mail"
description = "Rustlavel mail: MIME messages, an SMTP client written on Tokio, and multi-channel notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-view.workspace = true
rustlavel-client.workspace = true
tokio.workspace = true
# TLS only. The framework writes its own protocols — SMTP included — but never
# its own cryptography; a hand-rolled TLS stack would be a vulnerability, not a
# feature.
#
# `aws_lc_rs` with `prefer-post-quantum`, so the X25519MLKEM768 hybrid key
# exchange leads the ClientHello. `ring` offers no post-quantum group at all.
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "aws_lc_rs",
    "prefer-post-quantum",
    "tls12",
] }
webpki-roots = "0.26"
