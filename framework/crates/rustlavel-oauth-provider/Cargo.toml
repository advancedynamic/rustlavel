[package]
name = "rustlavel-oauth-provider"
description = "Be an OAuth 2.1 provider: authorization code + PKCE, refresh rotation, revocation, introspection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true

[features]
# Stores backed by a table each. Optional, so an authorization server whose
# storage lives somewhere else — or a test using the in-memory stores — does not
# compile the database package.
db = ["dep:rustlavel-db"]

[dependencies]
rustlavel-core.workspace = true
rustlavel-db = { workspace = true, optional = true }
rustlavel-http.workspace = true
rustlavel-auth.workspace = true
rustlavel-oauth.workspace = true
tokio.workspace = true
# Every credential this crate stores is stored as a SHA-256 digest, and PKCE's
# S256 challenge is the same hash. Hashing is the one thing the framework does
# not write for itself: a hand-rolled digest looks correct from the first test
# and is a vulnerability regardless.
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
# The database stores are proved against a real database, including the two
# operations whose whole contract is what happens under contention.
rustlavel-db.workspace = true
