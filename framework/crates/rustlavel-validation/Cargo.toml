[package]
name = "rustlavel-validation"
description = "Rustlavel validation: Laravel-style rules with 422 JSON error responses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-http.workspace = true

[dev-dependencies]
# The round-trip test needs a session to leave the messages in, which is what
# `tests/redirect_back.rs` exists to exercise. A dev-dependency only: this crate
# must not depend on sessions to validate anything.
rustlavel-auth.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
