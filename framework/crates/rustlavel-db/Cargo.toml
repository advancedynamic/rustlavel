[package]
name = "rustlavel-db"
description = "Rustlavel database layer: PostgreSQL driver, query builder, migrations, and ORM"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-macros.workspace = true
