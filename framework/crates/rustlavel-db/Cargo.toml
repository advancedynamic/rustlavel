[package]
name = "rustlavel-db"
description = "Rustlavel database layer: PostgreSQL driver, query builder, migrations, and ORM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-macros.workspace = true
tokio.workspace = true
# Authentication only. Everything else in this crate is written from scratch;
# hand-rolling the primitives behind SCRAM would be a security risk, not a
# feature.
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
# Same exception, for MySQL: `mysql_native_password` is built on SHA-1, and a
# hand-written SHA-1 that is subtly wrong fails open, not closed. The MySQL
# protocol itself is ours; only the digest is borrowed.
sha1 = "0.10"
# TLS only, for the SQL Server driver: TDS negotiates encryption inside its own
# pre-login exchange and the login packet is never sent in the clear. The
# framework writes its own protocols, but never its own cryptography — a
# hand-rolled TLS stack would be a vulnerability, not a feature.
#
# `aws_lc_rs` to match the other TLS crates. Two providers in one dependency
# graph make rustls refuse to pick, so this is not a free choice per crate.
# Note that the post-quantum key exchange does not reach this driver: TDS pins
# the connection to TLS 1.2, and X25519MLKEM768 is TLS 1.3 only.
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "aws_lc_rs",
    "prefer-post-quantum",
    "tls12",
] }
webpki-roots = "0.26"

# SQLite, and the only C dependency in this workspace.
#
# Every other driver here speaks a wire protocol written from scratch, because
# the database is at the other end of a socket. SQLite has no socket: the
# library *is* the database, so there is no protocol to write — the choice is
# only whose binding to use, and a hand-written one would own `unsafe` without
# removing any C.
#
# `bundled` compiles SQLite from the vendored amalgamation rather than linking
# whatever the machine happens to have. That is the point: the reason to want
# SQLite here is tests that need no container, and a fixture is worthless if
# the engine differs between a contributor's laptop and CI.
#
# Optional, and off by default. A build that does not ask for `sqlite`
# compiles no C at all and needs no C compiler.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[features]
default = []
sqlite = ["dep:rusqlite"]
