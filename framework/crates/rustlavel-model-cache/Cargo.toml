[package]
name = "rustlavel-model-cache"
description = "A second-level cache for Rustlavel models: entities and query results over any cache driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-db.workspace = true
# The backend. This crate holds no storage of its own on purpose: `Cache` is
# already the abstraction, with memory, file and Redis behind it, and a second
# one here would be a second place to configure the same thing.
rustlavel-cache.workspace = true
tokio.workspace = true

[dev-dependencies]
# For the event bus, to count queries in the miss-costs-one-query test.
rustlavel-core.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
