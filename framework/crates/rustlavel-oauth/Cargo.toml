[package]
name = "rustlavel-oauth"
description = "OAuth 2.1 for Rustlavel: the shared protocol types, and the client half"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-http.workspace = true
rustlavel-client.workspace = true
rustlavel-auth.workspace = true
# PKCE's S256 challenge, and nothing else. Hashing is the one thing this
# framework does not write for itself.
sha2 = "0.10"
# The ES256 signature on a self-contained token. The JWT *format* is written
# here like every other format in this project; the signature is not, because a
# hand-rolled one is what the cryptography exception exists to prevent. Already
# in the tree for WebAuthn.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[dev-dependencies]
tokio = { workspace = true }
