[package]
name = "rustlavel"
description = "A Laravel-inspired full-stack web framework for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-http.workspace = true
# Opt-in packages. What is not enabled is never compiled.
rustlavel-ai = { workspace = true, optional = true }
rustlavel-auth = { workspace = true, optional = true }
rustlavel-cache = { workspace = true, optional = true }
rustlavel-client = { workspace = true, optional = true }
rustlavel-db = { workspace = true, optional = true }
rustlavel-i18n = { workspace = true, optional = true }
rustlavel-mail = { workspace = true, optional = true }
rustlavel-mcp = { workspace = true, optional = true }
rustlavel-metrics = { workspace = true, optional = true }
rustlavel-openapi = { workspace = true, optional = true }
rustlavel-queue = { workspace = true, optional = true }
rustlavel-storage = { workspace = true, optional = true }
rustlavel-telescope = { workspace = true, optional = true }
rustlavel-validation = { workspace = true, optional = true }
rustlavel-view = { workspace = true, optional = true }
rustlavel-ws = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
rustlavel-view.workspace = true

[features]
default = []
ai = ["dep:rustlavel-ai"]
auth = ["dep:rustlavel-auth"]
cache = ["dep:rustlavel-cache"]
client = ["dep:rustlavel-client"]
db = ["dep:rustlavel-db"]
i18n = ["dep:rustlavel-i18n"]
mail = ["dep:rustlavel-mail", "view"]
mcp = ["dep:rustlavel-mcp"]
metrics = ["dep:rustlavel-metrics"]
openapi = ["dep:rustlavel-openapi"]
queue = ["dep:rustlavel-queue", "db"]
storage = ["dep:rustlavel-storage"]
telescope = ["dep:rustlavel-telescope"]
validation = ["dep:rustlavel-validation"]
view = ["dep:rustlavel-view"]
ws = ["dep:rustlavel-ws"]
# Everything the framework currently ships, for trying it out.
full = [
    "ai",
    "auth",
    "cache",
    "client",
    "db",
    "i18n",
    "mail",
    "mcp",
    "metrics",
    "openapi",
    "queue",
    "storage",
    "telescope",
    "validation",
    "view",
    "ws",
]
