[package]
name = "rustlavel"
description = "A Laravel-inspired full-stack web framework for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-http.workspace = true
# Both re-exported, so an application never adds a runtime or a macro crate of
# its own. Async Rust requires a runtime and std ships none; that should be the
# framework's problem, not a second `cargo add` before anything compiles.
rustlavel-macros.workspace = true
tokio = { workspace = true }
# Opt-in packages. What is not enabled is never compiled.
rustlavel-ai = { workspace = true, optional = true }
rustlavel-auth = { workspace = true, optional = true }
rustlavel-cache = { workspace = true, optional = true }
rustlavel-client = { workspace = true, optional = true }
rustlavel-db = { workspace = true, optional = true }
rustlavel-debugbar = { workspace = true, optional = true }
rustlavel-i18n = { workspace = true, optional = true }
rustlavel-ldap = { workspace = true, optional = true }
rustlavel-mail = { workspace = true, optional = true }
rustlavel-mcp = { workspace = true, optional = true }
rustlavel-metrics = { workspace = true, optional = true }
rustlavel-model-cache = { workspace = true, optional = true }
rustlavel-oauth = { workspace = true, optional = true }
rustlavel-oauth-provider = { workspace = true, optional = true }
rustlavel-openapi = { workspace = true, optional = true }
rustlavel-otel = { workspace = true, optional = true }
rustlavel-search = { workspace = true, optional = true }
rustlavel-audit = { workspace = true, optional = true }
rustlavel-flags = { workspace = true, optional = true }
rustlavel-gateway = { workspace = true, optional = true }
rustlavel-discovery = { workspace = true, optional = true }
rustlavel-payment = { workspace = true, optional = true }
rustlavel-ledger = { workspace = true, optional = true }
rustlavel-billing = { workspace = true, optional = true }
rustlavel-rbac = { workspace = true, optional = true }
rustlavel-queue = { workspace = true, optional = true }
rustlavel-storage = { workspace = true, optional = true }
rustlavel-telescope = { workspace = true, optional = true }
rustlavel-validation = { workspace = true, optional = true }
rustlavel-vault = { workspace = true, optional = true }
rustlavel-view = { workspace = true, optional = true }
rustlavel-webauthn = { workspace = true, optional = true }
rustlavel-ws = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
rustlavel-view.workspace = true

[features]
default = []
ai = ["dep:rustlavel-ai"]
auth = ["dep:rustlavel-auth"]
cache = ["dep:rustlavel-cache"]
# Valkey is the Linux Foundation fork of Redis and speaks its protocol
# unchanged, so this is the cache package under the name of the server you run.
# The whole Redis suite passes against Valkey 8, and `valkey://` URLs and
# `CACHE_DRIVER=valkey` are accepted — the feature exists so that the answer to
# "does it support Valkey" is a line in this file rather than a search.
valkey = ["cache"]
# Sessions in Redis rather than on the local disk, for an application running
# more than one process. Pulls in the cache package, which is where the Redis
# client lives.
redis-sessions = ["auth", "cache", "rustlavel-auth/redis"]
client = ["dep:rustlavel-client"]
# `rustlavel-oauth-provider?/db` is a weak feature: the authorization server's
# database-backed stores are compiled only when the provider is also enabled.
# Without the `?` every application with a database would drag the OAuth
# provider in.
db = ["dep:rustlavel-db", "rustlavel-oauth-provider?/db", "rustlavel-payment?/db"]
# The development overlay. Off in production unless said so in full.
debugbar = ["dep:rustlavel-debugbar"]
i18n = ["dep:rustlavel-i18n"]
# Authenticating against a directory. Brings the guard along, since a
# successful bind has to establish a session to be worth anything.
ldap = ["dep:rustlavel-ldap", "auth"]
mail = ["dep:rustlavel-mail", "view"]
mcp = ["dep:rustlavel-mcp"]
metrics = ["dep:rustlavel-metrics"]
# Signing in *through* Google, GitHub and the rest. Needs the session guard
# and the outbound HTTP client, so it turns both on.
oauth = ["dep:rustlavel-oauth", "auth", "client"]
# Being the provider yourself. Renders a consent screen, so it needs auth.
# `rustlavel-oauth-provider?/db` is a weak feature: the database-backed stores
# are compiled only when the application also enabled `db`. Without the `?` an
# authorization server whose storage lives elsewhere would drag the whole
# database package in.
oauth-provider = ["dep:rustlavel-oauth-provider", "oauth", "auth"]
openapi = ["dep:rustlavel-openapi"]
# Traces and metrics over OTLP, fed from the instrumentation bus.
otel = ["dep:rustlavel-otel", "client"]
# Elasticsearch and OpenSearch, which speak the same API.
search = ["dep:rustlavel-search", "client"]
# Roles and permissions. Needs the database it stores them in and the guard
# that says who is asking.
# Runtime switches, resolved per user. Distinct from the Cargo feature flags
# above: those are compile-time and decide what is in the binary at all.
audit = ["dep:rustlavel-audit", "db", "auth"]
flags = ["dep:rustlavel-flags", "auth"]
# An API gateway. Pulls in the client, which is what talks to the upstreams.
# `rustlavel-discovery?/gateway` is a weak feature: it turns on routing by
# service name *only* when discovery is also enabled. Cargo has no way to say
# "when both of these are on", and without the `?` this would drag the whole
# registry into every gateway.
gateway = ["dep:rustlavel-gateway", "client", "rustlavel-discovery?/gateway"]
# A service registry and the client that uses it. Enabling it alongside the
# gateway turns on `Upstream::service`, which routes by name.
discovery = ["dep:rustlavel-discovery", "client"]
# Payment gateways behind one trait, and a webhook receiver that verifies and
# deduplicates. The table-backed webhook log rides on `db` the way the OAuth
# provider's stores do.
payment = ["dep:rustlavel-payment", "client"]
# A double-entry ledger for credits and balances. Needs the database: the
# guarantees are about what the database does under contention.
ledger = ["dep:rustlavel-ledger", "db"]
# Plans and subscriptions paid by invoice rather than auto-debit: a charge each
# cycle through `payment`, credits each cycle through `ledger`.
billing = ["dep:rustlavel-billing", "payment", "ledger"]
model-cache = ["dep:rustlavel-model-cache", "db", "cache"]
rbac = ["dep:rustlavel-rbac", "db", "auth"]
queue = ["dep:rustlavel-queue", "db"]
storage = ["dep:rustlavel-storage"]
telescope = ["dep:rustlavel-telescope"]
validation = ["dep:rustlavel-validation"]
# Secrets from OpenBao or HashiCorp Vault. Needs the outbound HTTP client.
vault = ["dep:rustlavel-vault", "client"]
view = ["dep:rustlavel-view"]
# Passkeys. Needs the guard: a verified assertion has to log somebody in.
webauthn = ["dep:rustlavel-webauthn", "auth"]
ws = ["dep:rustlavel-ws"]
# Everything the framework currently ships, for trying it out.
full = [
    "ai",
    "auth",
    "billing",
    "cache",
    "client",
    "db",
    "debugbar",
    "discovery",
    "gateway",
    "i18n",
    "ldap",
    "ledger",
    "mail",
    "mcp",
    "metrics",
    "model-cache",
    "oauth",
    "oauth-provider",
    "openapi",
    "otel",
    "payment",
    "redis-sessions",
    "search",
    "audit",
    "flags",
    "rbac",
    "queue",
    "storage",
    "telescope",
    "validation",
    "valkey",
    "vault",
    "view",
    "webauthn",
    "ws",
]
