[package]
name = "rustlavel"
description = "A Laravel-inspired full-stack web framework for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-http.workspace = true
# Opt-in packages. What is not enabled is never compiled.
rustlavel-ai = { workspace = true, optional = true }
rustlavel-auth = { workspace = true, optional = true }
rustlavel-cache = { workspace = true, optional = true }
rustlavel-client = { workspace = true, optional = true }
rustlavel-db = { workspace = true, optional = true }
rustlavel-i18n = { workspace = true, optional = true }
rustlavel-ldap = { workspace = true, optional = true }
rustlavel-mail = { workspace = true, optional = true }
rustlavel-mcp = { workspace = true, optional = true }
rustlavel-metrics = { workspace = true, optional = true }
rustlavel-oauth = { workspace = true, optional = true }
rustlavel-oauth-provider = { workspace = true, optional = true }
rustlavel-openapi = { workspace = true, optional = true }
rustlavel-otel = { workspace = true, optional = true }
rustlavel-search = { workspace = true, optional = true }
rustlavel-queue = { workspace = true, optional = true }
rustlavel-storage = { workspace = true, optional = true }
rustlavel-telescope = { workspace = true, optional = true }
rustlavel-validation = { workspace = true, optional = true }
rustlavel-vault = { workspace = true, optional = true }
rustlavel-view = { workspace = true, optional = true }
rustlavel-webauthn = { workspace = true, optional = true }
rustlavel-ws = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
rustlavel-view.workspace = true

[features]
default = []
ai = ["dep:rustlavel-ai"]
auth = ["dep:rustlavel-auth"]
cache = ["dep:rustlavel-cache"]
client = ["dep:rustlavel-client"]
db = ["dep:rustlavel-db"]
i18n = ["dep:rustlavel-i18n"]
# Authenticating against a directory. Brings the guard along, since a
# successful bind has to establish a session to be worth anything.
ldap = ["dep:rustlavel-ldap", "auth"]
mail = ["dep:rustlavel-mail", "view"]
mcp = ["dep:rustlavel-mcp"]
metrics = ["dep:rustlavel-metrics"]
# Signing in *through* Google, GitHub and the rest. Needs the session guard
# and the outbound HTTP client, so it turns both on.
oauth = ["dep:rustlavel-oauth", "auth", "client"]
# Being the provider yourself. Renders a consent screen, so it needs auth.
oauth-provider = ["dep:rustlavel-oauth-provider", "oauth", "auth"]
openapi = ["dep:rustlavel-openapi"]
# Traces and metrics over OTLP, fed from the instrumentation bus.
otel = ["dep:rustlavel-otel", "client"]
# Elasticsearch and OpenSearch, which speak the same API.
search = ["dep:rustlavel-search", "client"]
queue = ["dep:rustlavel-queue", "db"]
storage = ["dep:rustlavel-storage"]
telescope = ["dep:rustlavel-telescope"]
validation = ["dep:rustlavel-validation"]
# Secrets from OpenBao or HashiCorp Vault. Needs the outbound HTTP client.
vault = ["dep:rustlavel-vault", "client"]
view = ["dep:rustlavel-view"]
# Passkeys. Needs the guard: a verified assertion has to log somebody in.
webauthn = ["dep:rustlavel-webauthn", "auth"]
ws = ["dep:rustlavel-ws"]
# Everything the framework currently ships, for trying it out.
full = [
    "ai",
    "auth",
    "cache",
    "client",
    "db",
    "i18n",
    "ldap",
    "mail",
    "mcp",
    "metrics",
    "oauth",
    "oauth-provider",
    "openapi",
    "otel",
    "search",
    "queue",
    "storage",
    "telescope",
    "validation",
    "vault",
    "view",
    "webauthn",
    "ws",
]
