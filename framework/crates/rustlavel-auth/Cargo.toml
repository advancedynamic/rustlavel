[package]
name = "rustlavel-auth"
description = "Rustlavel authentication: sessions, argon2 hashing, CSRF, signed URLs, encryption"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rustlavel-core.workspace = true
rustlavel-http.workspace = true
tokio.workspace = true
# Cryptography only. Everything non-cryptographic in this crate — base64, the
# session stores, the middleware, the URL canonicalisation — is written from
# scratch, but a hand-rolled KDF, cipher or MAC is a vulnerability, not a
# feature, so the primitives come from the RustCrypto crates.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
sha2 = "0.10"
# SHA-1 is here only because RFC 6238 says so. It is the default and, in
# practice, the only algorithm every authenticator app implements, so a TOTP
# secret that cannot be verified with HMAC-SHA1 cannot be enrolled at all. The
# collision attacks that retired SHA-1 for signatures do not apply to HMAC, and
# writing the compression function by hand would be the same mistake the crypto
# exception exists to prevent.
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
