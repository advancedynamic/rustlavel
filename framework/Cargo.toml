[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
# Measured, not assumed. Edition 2024 puts the floor at 1.85, but the code uses
# let-chains (`&& let`) in twenty-one places, and those stabilised in 1.88.
#
# The first version of this line said 1.85 — reasoned from the edition and from
# a grep that looked for nested `if let` rather than for `&& let`, so it missed
# every one of them. Installing the toolchain and building is what found it:
# 1.87 refuses with ``let` expressions in this position are unstable`, 1.88
# builds the whole workspace with every feature and every test target.
#
# A declared floor that is too low is worse than none: cargo tells a consumer
# on 1.86 that the crate is compatible, and rustc then refuses it.
#
# **Declaring it here is half the job.** `[workspace.package]` is opt-in: a
# member inherits a field only by asking for it, so every crate carries
# `rust-version.workspace = true`. Without that line in all thirty-three, this
# one reaches no published manifest at all — crates.io reported `rust_version:
# null` for 0.5.2 and a consumer on 1.87 still got `let expressions in this
# position are unstable` from inside `rustlavel-core`. With it, cargo says
# `rustc 1.87.0 is not supported ... requires rustc 1.88` and stops.
rust-version = "1.88"
license = "MIT"
authors = ["Advance Dynamic Software"]
repository = "https://github.com/advancedynamic/rustlavel"

[workspace.dependencies]
rustlavel-core = { path = "crates/rustlavel-core", version = "0.6.0" }
rustlavel-http = { path = "crates/rustlavel-http", version = "0.6.0" }
rustlavel-auth = { path = "crates/rustlavel-auth", version = "0.6.0" }
