[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2024"
# The floor edition 2024 imposes: it stabilised in Rust 1.85.
#
# Declared so cargo knows it rather than discovering it. A toolchain that is
# too old already fails — `feature `edition2024` is required`, three "Caused
# by" levels down — but that is a parse error at the end of a resolve; with
# this, a consumer's cargo can say the crate needs 1.85 while it is still
# choosing versions, and can pick an older compatible release instead.
#
# Verified here: 1.75 is refused, 1.95 builds. 1.85 is the edition's own floor
# rather than something measured — the toolchains between are not installed.
rust-version = "1.85"
license = "MIT"
authors = ["Advance Dynamic Software"]
repository = "https://github.com/advancedynamic/rustlavel"

[workspace.dependencies]
rustlavel-core = { path = "crates/rustlavel-core", version = "0.5.1" }
rustlavel-http = { path = "crates/rustlavel-http", version = "0.5.1" }
rustlavel-auth = { path = "crates/rustlavel-auth", version = "0.5.1" }
rustlavel-debugbar = { path = "crates/rustlavel-debugbar", version = "0.5.1" }
rustlavel-i18n = { path = "crates/rustlavel-i18n", version = "0.5.1" }
rustlavel-client = { path = "crates/rustlavel-client", version = "0.5.1" }
rustlavel-cache = { path = "crates/rustlavel-cache", version = "0.5.1" }
rustlavel-db = { path = "crates/rustlavel-db", version = "0.5.1" }
rustlavel-ldap = { path = "crates/rustlavel-ldap", version = "0.5.1" }
rustlavel-otel = { path = "crates/rustlavel-otel", version = "0.5.1" }
rustlavel-search = { path = "crates/rustlavel-search", version = "0.5.1" }
rustlavel-macros = { path = "crates/rustlavel-macros", version = "0.5.1" }
rustlavel-view = { path = "crates/rustlavel-view", version = "0.5.1" }
rustlavel-model-cache = { path = "crates/rustlavel-model-cache", version = "0.5.1" }
rustlavel-metrics = { path = "crates/rustlavel-metrics", version = "0.5.1" }
rustlavel-oauth = { path = "crates/rustlavel-oauth", version = "0.5.1" }
