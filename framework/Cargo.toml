rustlavel-cache = { path = "crates/rustlavel-cache", version = "0.6.0" }
rustlavel-db = { path = "crates/rustlavel-db", version = "0.6.0" }
rustlavel-ldap = { path = "crates/rustlavel-ldap", version = "0.6.0" }
rustlavel-otel = { path = "crates/rustlavel-otel", version = "0.6.0" }
rustlavel-search = { path = "crates/rustlavel-search", version = "0.6.0" }
