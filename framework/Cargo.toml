[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
authors = ["Advance Dynamic Software"]
repository = "https://github.com/advancedynamic/rustlavel"

[workspace.dependencies]
rustlavel-core = { path = "crates/rustlavel-core", version = "0.3.2" }
rustlavel-http = { path = "crates/rustlavel-http", version = "0.3.2" }
rustlavel-auth = { path = "crates/rustlavel-auth", version = "0.3.2" }
rustlavel-debugbar = { path = "crates/rustlavel-debugbar", version = "0.3.2" }
rustlavel-i18n = { path = "crates/rustlavel-i18n", version = "0.3.2" }
rustlavel-client = { path = "crates/rustlavel-client", version = "0.3.2" }
rustlavel-cache = { path = "crates/rustlavel-cache", version = "0.3.2" }
rustlavel-db = { path = "crates/rustlavel-db", version = "0.3.2" }
rustlavel-ldap = { path = "crates/rustlavel-ldap", version = "0.3.2" }
rustlavel-otel = { path = "crates/rustlavel-otel", version = "0.3.2" }
rustlavel-search = { path = "crates/rustlavel-search", version = "0.3.2" }
rustlavel-macros = { path = "crates/rustlavel-macros", version = "0.3.2" }
rustlavel-view = { path = "crates/rustlavel-view", version = "0.3.2" }
rustlavel-metrics = { path = "crates/rustlavel-metrics", version = "0.3.2" }
rustlavel-oauth = { path = "crates/rustlavel-oauth", version = "0.3.2" }
rustlavel-oauth-provider = { path = "crates/rustlavel-oauth-provider", version = "0.3.2" }
rustlavel-openapi = { path = "crates/rustlavel-openapi", version = "0.3.2" }
rustlavel-storage = { path = "crates/rustlavel-storage", version = "0.3.2" }
rustlavel-validation = { path = "crates/rustlavel-validation", version = "0.3.2" }
rustlavel-vault = { path = "crates/rustlavel-vault", version = "0.3.2" }
rustlavel-telescope = { path = "crates/rustlavel-telescope", version = "0.3.2" }
rustlavel-ai = { path = "crates/rustlavel-ai", version = "0.3.2" }
rustlavel-audit = { path = "crates/rustlavel-audit", version = "0.3.2" }
rustlavel-flags = { path = "crates/rustlavel-flags", version = "0.3.2" }
rustlavel-rbac = { path = "crates/rustlavel-rbac", version = "0.3.2" }
rustlavel-queue = { path = "crates/rustlavel-queue", version = "0.3.2" }
rustlavel-mail = { path = "crates/rustlavel-mail", version = "0.3.2" }
rustlavel-mcp = { path = "crates/rustlavel-mcp", version = "0.3.2" }
rustlavel-webauthn = { path = "crates/rustlavel-webauthn", version = "0.3.2" }
rustlavel-ws = { path = "crates/rustlavel-ws", version = "0.3.2" }
tokio = { version = "1", features = ["full"] }
