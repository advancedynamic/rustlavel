rustlavel-queue = { path = "crates/rustlavel-queue", version = "0.5.1" }
rustlavel-mail = { path = "crates/rustlavel-mail", version = "0.5.1" }
rustlavel-mcp = { path = "crates/rustlavel-mcp", version = "0.5.1" }
