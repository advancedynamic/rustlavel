[package]
name = "bench-axum"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
] }
askama = "0.16"

# The comparison is between release builds, and a benchmark of a debug build is
# a benchmark of nothing. Identical to the Rustlavel entry's profile.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
