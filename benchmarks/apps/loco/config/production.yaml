# The benchmark's production configuration. See `benchmarks/CONTRACT.md`.
#
# Everything the contract does not exercise is turned off: no mailer, no queue,
# no auth, no cache, and none of Loco's optional middleware stack. What remains
# is a REST API server and a Postgres pool.

# Logging is off. An access log per request is a write to stdout in the hot
# path, and no other app under `apps/` has one.
logger:
  enable: false
  pretty_backtrace: false
  level: error
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  host: <%= get_env(name="HOST", default="http://localhost") %>
  # An empty ident suppresses the `X-Powered-By: loco.rs` header.
  ident: ""
  middlewares:
    # Every optional middleware Loco offers, explicitly disabled. The defaults
    # (see `default_middleware_stack`) enable catch_panic, etag, request_id and
    # the logger; the other apps in this comparison have no global stack at
    # all, so neither does this one.
    compression:
      enable: false
    etag:
      enable: false
    logger:
      enable: false
    catch_panic:
      enable: false
    timeout_request:
      enable: false
    cors:
      enable: false
    static:
      enable: false
    secure_headers:
      enable: false
    remote_ip:
      enable: false
    fallback:
      enable: false
    request_id:
      enable: false

# No cache is used by any endpoint.
cache:
  # Quoted: bare `Null` is YAML's null, not the enum variant's name.
  kind: "Null"

database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 5000
  # The contract fixes the pool at 16 for every app, so the comparison is
  # between drivers rather than between two pool sizes. The floor stays at 1:
  # startup time is one of the measured numbers, and opening 16 connections
  # before the first request would charge Loco for something the other apps'
  # lazy pools do not do.
  min_connections: 1
  max_connections: 16
  # The fixture is created and seeded outside the application; the migrator
  # carries no migrations and must never touch these tables.
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false
