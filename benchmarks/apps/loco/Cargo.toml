[workspace]

[package]
name = "loco"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "loco-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
# The lightest usable Loco: the CLI (`cargo loco start`) and the database.
# `auth`, `worker` and `cache_inmem` are on by default and none of them is
# exercised by the benchmark contract, so they are compiled out.
loco-rs = { version = "1.1", default-features = false, features = [
  "cli",
  "with-db",
] }

[dependencies]
loco-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }

[[bin]]
name = "loco-cli"
path = "src/bin/main.rs"
required-features = []

# The comparison is between release builds, and a benchmark of a debug build is
# a benchmark of nothing.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
