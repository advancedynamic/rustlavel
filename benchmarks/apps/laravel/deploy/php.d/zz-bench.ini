; Production PHP settings for the benchmark. Loaded by prepending this
; directory to PHP_INI_SCAN_DIR, so nothing outside the app is modified.
;
; This is the OPcache configuration a real deployment runs: the compiled
; opcodes are kept in shared memory and the filesystem is never stat'd for
; changes, which is exactly what `opcache.validate_timestamps=0` buys and
; exactly what makes it a deployment-time decision rather than a dev one.

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600

expose_php = Off
display_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 30
