# The harness sets PORT; everything else has a working local default.
server.port=${PORT:8080}

# The datasource. The harness sets DATABASE_URL in the libpq form
# (postgres://bench:bench@127.0.0.1:55440/bench); BenchApplication translates it
# into spring.datasource.url/username/password as system properties before the
# context starts, and those win over the defaults below. A deployment that would
# rather set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD directly can do that
# instead and leave DATABASE_URL unset.
spring.datasource.url=jdbc:postgresql://127.0.0.1:55440/bench
spring.datasource.username=bench
spring.datasource.password=bench
spring.datasource.driver-class-name=org.postgresql.Driver

# The pool every app in the comparison uses.
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=16
spring.datasource.hikari.pool-name=bench

# The schema is created and seeded by the harness. Nothing here may touch it:
# there is no JPA/Hibernate on the classpath at all, and Spring's own SQL
# initialiser is off.
spring.sql.init.mode=never

# Templates are compiled once and cached, as in any production deployment.
spring.thymeleaf.cache=true

# Production configuration: no devtools on the classpath, no live reload,
# INFO logging (Spring Boot's default), no SQL logging.
spring.jmx.enabled=false
